# ---------------------------------------------------------------------------
# The OpenAPI spec for the Orders API.
#
# This is the ONLY thing AgentCore Gateway needs to turn the API into agent
# tools. Each operation below (its operationId, summary, and schemas) becomes
# one MCP tool. Rich descriptions matter: the agent reads them to decide which
# tool to call, so write them for a reader, not just a compiler.
#
# You can hand-write this (as here) or export it from a deployed API:
#   aws apigateway get-export --rest-api-id <id> --stage-name Prod \
#     --export-type oas30 openapi.json
# ---------------------------------------------------------------------------
# Auth is NOT declared in this spec on purpose: AgentCore Gateway doesn't support
# OpenAPI security schemes in target specs. The API requires an x-api-key header
# (ApiKeyRequired in template.yaml), and Gateway supplies it via the target's
# outbound API-key credential. See the README "Security" section.
# checkov:skip=CKV_OPENAPI_4: AgentCore Gateway rejects spec-level security schemes; the API key is enforced by API Gateway and sent via Gateway outbound auth.
# checkov:skip=CKV_OPENAPI_5: AgentCore Gateway rejects spec-level security schemes; the API key is enforced by API Gateway and sent via Gateway outbound auth.
openapi: 3.0.1
info:
  title: Orders API
  description: Look up customer orders.
  version: "1.0.0"

servers:
  # Placeholder — setup_gateway.py overwrites this with your live ApiBaseUrl at
  # deploy time, so you don't need to edit it by hand.
  - url: https://REPLACE_ME.execute-api.us-west-2.amazonaws.com/Prod

paths:
  /orders:
    get:
      operationId: listOrders
      summary: List all orders
      description: Returns every order in the system.
      responses:
        "200":
          description: A list of orders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    maxItems: 1000
                    items:
                      $ref: "#/components/schemas/Order"

  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Get a single order by its ID
      description: Returns the full details of one order, including its status and amount.
      parameters:
        - name: orderId
          in: path
          required: true
          description: The unique ID of the order, e.g. "12345".
          schema:
            type: string
      responses:
        "200":
          description: The requested order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: No order with that ID exists.

components:
  schemas:
    Order:
      type: object
      properties:
        orderId:
          type: string
        customer:
          type: string
        item:
          type: string
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
          description: One of PLACED, SHIPPED, DELIVERED.
