AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Demo 1 - the "existing" Orders API (API Gateway -> Lambda).
  A normal serverless REST API. Nothing agent-specific. Every route requires an
  API key (x-api-key header), and a usage plan throttles callers.

# Applies to the implicit API that SAM builds from the function's Api events.
Globals:
  Api:
    Auth:
      ApiKeyRequired: true

Resources:
  # -------------------------------------------------------------------------
  # The Lambda function that implements the API.
  # -------------------------------------------------------------------------
  OrdersFunction:
    Type: AWS::Serverless::Function
    # Security-scan suppressions. This is a short-lived demo stack that returns
    # static sample data; see the README "Security" section before reusing it.
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_117
            comment: No VPC resources are accessed; a VPC adds cost and cold-start latency with no benefit.
          - id: CKV_AWS_116
            comment: Invoked synchronously by API Gateway; a DLQ only applies to async invocations.
          - id: CKV_AWS_115
            comment: Reserved concurrency fails in low-limit sandbox accounts; demo stack is torn down after use.
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: No VPC resources are accessed; a VPC adds cost and cold-start latency with no benefit.
          - id: W92
            reason: Reserved concurrency fails in low-limit sandbox accounts; demo stack is torn down after use.
    Properties:
      FunctionName: orders-api
      Runtime: python3.13
      Handler: app.handler
      CodeUri: src/
      MemorySize: 128
      Timeout: 10
      Events:
        # Each Event below becomes a route on the same API Gateway REST API.
        ListOrders:
          Type: Api
          Properties:
            Path: /orders
            Method: get
        GetOrder:
          Type: Api
          Properties:
            Path: /orders/{orderId}
            Method: get

  # -------------------------------------------------------------------------
  # API key + usage plan. AgentCore Gateway sends the key in the x-api-key
  # header (Demo 1 registers it as the target's outbound credential). The key
  # value is generated by API Gateway and read at demo time, never stored here.
  # -------------------------------------------------------------------------
  OrdersApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Description: Key AgentCore Gateway uses to call the Orders API
      Enabled: true

  OrdersUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      ApiStages:
        - ApiId: !Ref ServerlessRestApi
          Stage: !Ref ServerlessRestApiProdStage   # Ref (not "Prod") so scanners link the plan to the stage
      Throttle:
        RateLimit: 10
        BurstLimit: 20
      Quota:
        Limit: 10000
        Period: DAY

  OrdersUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref OrdersApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref OrdersUsagePlan

Outputs:
  # The base URL of the deployed API. We hand this (and its OpenAPI spec)
  # to AgentCore Gateway in the next step.
  ApiBaseUrl:
    Description: Base URL of the Orders API
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  ApiKeyId:
    Description: ID of the API key (fetch the value with aws apigateway get-api-key --include-value)
    Value: !Ref OrdersApiKey
